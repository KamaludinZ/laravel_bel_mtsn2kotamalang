[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
; Disesuaikan untuk aplikasi bel (trafik kecil, VPS kecil). Nilai lama
; (max_children 50, start 10) bisa memakan beberapa GB RAM dan 10 proses idle.
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Logging
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
catch_workers_output = yes

; Environment variables
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; Clear environment in FPM workers
clear_env = no
