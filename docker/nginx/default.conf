server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;

    # Error logging
    error_log /dev/stderr warn;
    access_log /dev/stdout;

    # Increase client max body size for audio uploads
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/xml+rss application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Healthcheck dipanggil tiap 30 detik: jangan banjiri access log
    location = /api/health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /health.html {
        access_log off;
    }

    # File audio bel: izinkan cache browser agar tidak diunduh ulang setiap bel berbunyi
    location ~* \.(mp3|wav|ogg|m4a|aac|oga|webm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|htaccess) {
        deny all;
    }
}
