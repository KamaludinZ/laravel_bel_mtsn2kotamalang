services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bel_sekolah_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bel_sekolah_mtsn2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST_AUTH_METHOD: md5
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - bel_sekolah_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bel_sekolah_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - bel_sekolah_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bel_sekolah_mtsn2
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres123

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: bel_sekolah_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bel_sekolah_network
    depends_on:
      - app

  # Node.js for Vite (Development only)
  vite:
    image: node:20-alpine
    container_name: bel_sekolah_vite
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - bel_sekolah_network
    profiles:
      - development

networks:
  bel_sekolah_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
